#
# Builds Flow's Linux packages (AppImage, .deb, .rpm) and uploads them as
# workflow artifacts. Separate from and does not touch the existing
# (manual, Windows-only) release process.
#
# Runs on ubuntu-22.04 deliberately, not a newer Ubuntu: linuxdeploy's
# bundled `strip` doesn't understand the RELR relocations that newer
# glibc/binutils toolchains emit by default, which breaks AppImage bundling
# entirely on more recent distros. This was reproduced and confirmed by
# hand during Phase 6.1 of the Linux port.
#
# The AppImage build additionally works around two more environment-
# specific issues also found and fixed by hand in Phase 6.1:
#   - linuxdeploy's own AppImage tries to FUSE-mount itself, which sandboxed/
#     containerized CI runners commonly can't do; APPIMAGE_EXTRACT_AND_RUN=1
#     makes every AppImage runtime involved (including nested plugin
#     AppImages) fall back to extracting instead.
#   - linuxdeploy's dependency scanner runs `ldd` on the compiled binary to
#     decide what to bundle, but can't resolve the vendored (not system-
#     installed) libvosk.so unless it's on LD_LIBRARY_PATH at bundle time.
#     The binary's own runtime resolution goes through its RUNPATH, not
#     this variable - this is only needed to help linuxdeploy find the file
#     to copy in the first place.
#
# packaging/linux/fix-appimage-libs.sh removes a handful of bundled Wayland/
# XCB client libraries that linuxdeploy-plugin-gtk pulls in but which must
# come from the host's own compositor/X server to avoid version-mismatch
# EGL failures (also found and fixed by hand in Phase 6.1, reproduced on a
# real desktop after building on Ubuntu 22.04).
#
# TAURI_SIGNING_PRIVATE_KEY is expected to be the same key already used for
# the existing Windows updater artifacts (see Phase 6.4 - the plan calls
# for reusing it, not creating a new one). If it isn't configured as a
# repository secret yet, the AppImage is still built, just without updater
# artifacts, so this workflow doesn't hard-depend on Phase 6.4 being done
# first.

name: Build Linux

on:
  push:
    branches:
      - linux-native-build
    paths:
      - "src/**"
      - "src-tauri/**"
      - "packaging/linux/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-linux.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "packaging/linux/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-linux.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build AppImage / deb / rpm
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            xdg-utils \
            unzip \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch vendored Vosk library
        run: bash packaging/linux/fetch-vosk.sh

      - name: Build AppImage
        env:
          FLOW_LINUX_PACKAGE: appimage
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/resources/vosk/linux-x64
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "Signing key configured - building AppImage with updater artifacts"
            npx tauri build \
              --config src-tauri/tauri.linux.conf.json \
              --config src-tauri/tauri.linux.appimage.conf.json \
              --bundles appimage
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not configured - building AppImage without updater artifacts"
            npx tauri build \
              --config src-tauri/tauri.linux.conf.json \
              --bundles appimage
          fi

      - name: Fix bundled Wayland/XCB libraries in AppImage
        run: |
          APPIMAGE_PATH="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage')"
          bash packaging/linux/fix-appimage-libs.sh "${APPIMAGE_PATH}"

      - name: Build .deb
        env:
          FLOW_LINUX_PACKAGE: deb
        run: npx tauri build --config src-tauri/tauri.linux.conf.json --bundles deb

      - name: Build .rpm
        env:
          FLOW_LINUX_PACKAGE: rpm
        run: npx tauri build --config src-tauri/tauri.linux.conf.json --bundles rpm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flow-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
