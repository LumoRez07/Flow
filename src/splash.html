<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow Booting</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="splashScreen" class="splash-screen">
      <div class="splash-content">
        <div class="splash-brand">
          <img class="splash-icon" src="./assets/logo.svg" alt="Flow Logo" width="48" height="48" />
          <div class="splash-title-row">
            <span class="splash-title">Flow</span>
            <span id="splashEdition" class="splash-edition">V2 Community</span>
          </div>
        </div>

        <div class="splash-progress">
          <div class="splash-progress-inner"></div>
        </div>
      </div>
    </div>

    <script type="module">
      import { initializeSplashScreen } from "./pages/splash.js";
      initializeSplashScreen();
    </script>
  </body>
</html>
